[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-copilot"
version = "0.1.0"
description = "Grounded synthetic financial analysis with deterministic tools"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
live = ["litellm>=1.80,<2"]
dev = ["pytest==8.4.2", "ruff==0.16.7", "mypy==1.20.2", "jsonschema==4.26.0"]

[project.scripts]
fintech-copilot = "fintech_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fintech_copilot = ["resources/*.json", "resources/*.md", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: opt-in test requiring configured provider credentials"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true
